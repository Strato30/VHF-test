<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VHF 無線電話模擬考試</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    background: linear-gradient(145deg, #001a33 0%, #003366 40%, #006699 100%);
    min-height: 100vh;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}
.container {
    max-width: 860px;
    width: 100%;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    overflow: hidden;
}
header {
    background: #003366;
    color: white;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}
header h1 { font-size: 22px; font-weight: 700; }
header small { font-size: 12px; opacity: 0.8; display: block; margin-top: 2px; }
.timer {
    background: #f0c040;
    color: #003366;
    padding: 6px 18px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 16px;
    font-family: 'Courier New', monospace;
}
.nav-tabs {
    display: flex;
    background: #eef3f7;
    padding: 4px;
    gap: 6px;
}
.nav-tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    font-weight: 600;
    cursor: pointer;
    border-radius: 30px;
    transition: 0.2s;
    border: none;
    background: transparent;
    color: #004080;
    font-size: 14px;
}
.nav-tab.active { background: #003366; color: white; }
.nav-tab .count {
    background: rgba(255,255,255,0.25);
    padding: 0 10px;
    border-radius: 20px;
    margin-left: 5px;
    font-size: 12px;
}
.nav-tab.active .count { background: #f0c040; color: #003366; }
.panel { display: none; padding: 20px 22px; }
.panel.active { display: block; }

/* A部 */
.q-card {
    background: #f7faff;
    border: 1px solid #dce6f0;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
}
.q-card .q-title {
    font-size: 16px;
    font-weight: 600;
    color: #003366;
    margin-bottom: 10px;
}
.q-card .q-body {
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 12px;
}
.q-card textarea {
    width: 100%;
    min-height: 100px;
    padding: 12px;
    border: 1.5px solid #ced4da;
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
}
.q-card textarea:focus { outline: none; border-color: #003366; box-shadow: 0 0 0 3px rgba(0,51,102,0.15); }
.btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn {
    padding: 9px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: 0.15s;
}
.btn-primary { background: #003366; color: white; }
.btn-primary:hover { background: #002244; }
.btn-success { background: #28a745; color: white; }
.btn-success:hover { background: #218838; }
.btn-warning { background: #f0c040; color: #212529; }
.btn-warning:hover { background: #d4a017; }
.btn-outline { background: white; color: #003366; border: 1.5px solid #003366; }
.btn-outline:hover { background: #eef3f7; }
.ref-answer {
    display: none;
    margin-top: 12px;
    padding: 14px;
    background: #eef7ee;
    border-left: 5px solid #28a745;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
}
.ref-answer.show { display: block; }
.ref-answer h4 { color: #155724; margin-bottom: 6px; }
.ref-answer ul { padding-left: 18px; margin-top: 6px; }

/* B部 */
.b-list { max-height: 500px; overflow-y: auto; }
.b-item {
    padding: 12px 14px;
    margin: 5px 0;
    border-radius: 12px;
    cursor: pointer;
    background: #f8f9fa;
    transition: 0.15s;
    border: 1px solid #e2e8f0;
}
.b-item:hover { background: #e2e8f0; }
.b-item.active { background: #003366; color: white; }
.b-item.answered { background: #d4edda; border-color: #28a745; }
.b-item .num { font-weight: 700; margin-right: 8px; }
.b-item .status { float: right; font-size: 16px; }

.b-detail .q-text { font-size: 15px; font-weight: 500; margin-bottom: 12px; line-height: 1.6; }
.b-detail .opt-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: white;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    padding: 10px 14px;
    margin: 5px 0;
    cursor: pointer;
    font-size: 14px;
    transition: 0.15s;
}
.b-detail .opt-btn:hover:not(:disabled) { border-color: #003366; background: #eef3f7; }
.b-detail .opt-btn.correct { background: #d4edda; border-color: #28a745; }
.b-detail .opt-btn.wrong { background: #f8d7da; border-color: #dc3545; }
.b-detail .opt-btn:disabled { cursor: not-allowed; opacity: 0.85; }
.b-detail .exp-box {
    display: none;
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.6;
}
.b-detail .exp-box.show { display: block; }
.b-detail .exp-box.correct { background: #d4edda; border-left: 4px solid #28a745; }
.b-detail .exp-box.wrong { background: #f8d7da; border-left: 4px solid #dc3545; }

/* 結果總表 */
.result-wrap { margin-top: 20px; }
.result-summary {
    text-align: center;
    padding: 24px;
    background: linear-gradient(135deg, #f0f8ff, #eef3f7);
    border-radius: 18px;
    margin-bottom: 16px;
}
.result-summary .big-score { font-size: 56px; font-weight: 700; color: #003366; }
.result-summary .verdict { font-size: 20px; font-weight: 600; margin-top: 4px; }
.result-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.result-table th { background: #003366; color: white; padding: 8px 6px; text-align: left; }
.result-table td { padding: 6px; border-bottom: 1px solid #eee; }
.result-table tr.ok { background: #d4edda; }
.result-table tr.no { background: #f8d7da; }

.footer { text-align: center; padding: 14px; font-size: 11px; color: #999; border-top: 1px solid #eee; }

@media (max-width: 600px) {
    header h1 { font-size: 18px; }
    .nav-tab { font-size: 12px; padding: 8px 0; }
    .timer { font-size: 14px; padding: 4px 12px; }
}
</style>
</head>

<div class="container">
    <header>
        <div>
            <h1>📡 VHF 無線電話模擬考試</h1>

        <div class="timer" id="timerDisplay">⏱ 90:00</div>

    <div class="nav-tabs">
        <button class="nav-tab active" id="tabA">✍️ A部 — 撰寫題 <span class="count" id="aCount">0/2</span></button>
        <button class="nav-tab" id="tabB">📋 B部 — 選擇題 <span class="count" id="bCount">0/40</span></button>
    </div>

    <div class="panel active" id="panelA">
        <div id="aContent">
            <p style="text-align:center;color:#888;margin:40px 0;">🚀 請點擊下方「開始考試」按鈕載入題目</p>
        </div>
        <div style="text-align:center;margin-top:10px;">
            <button class="btn btn-success" id="startBtn" style="font-size:16px;padding:12px 36px;">🚀 開始考試</button>

        </div>
        <div style="text-align:center;margin-top:10px;display:none;" id="bBottomBtns">

            <button class="btn btn-outline" id="resetBtn">🔄 重新開始</button>

function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
}

// 為 B 部題目隨機打散選項順序，使 ABCD 均勻分佈
function shuffleBOptions(rawQ) {
    var opts = rawQ.o.slice();
    var correctText = rawQ.o[rawQ.a];
    // 打散選項
    var idx = opts.map(function(_, i) { return i; });
    idx = shuffle(idx);
    var newOpts = idx.map(function(i) { return opts[i]; });
    var newAns = idx.indexOf(rawQ.a);
    return { q: rawQ.q, options: newOpts, ans: newAns, exp: rawQ.e, correctText: correctText };
}

var bContent = $("bContent");
var startBtn = $("startBtn");
var timerDisplay = $("timerDisplay");
var aCount = $("aCount");
var bCount = $("bCount");
var tabA = $("tabA");
var tabB = $("tabB");
var panelA = $("panelA");
var panelB = $("panelB");
var scoreArea = $("scoreArea");
var bBottomBtns = $("bBottomBtns");
var submitBtn = $("submitBtn");
var resetBtn = $("resetBtn");

// ===================== 考試流程 =====================
function startExam() {
    if (examStarted) return;
    examStarted = true;

    // 隨機抽題
    var aPool = shuffle(partAPool).slice(0, 2);
    var bRaw = shuffle(bPoolRaw).slice(0, 40);
    examA = aPool;
    examB = bRaw.map(function(q) { return shuffleBOptions(q); });
    aIndex = 0;
    bIndex = 0;
    bAnswers = new Array(40).fill(null);

    // 更新 UI
    startBtn.disabled = true;
    startBtn.textContent = "✅ 考試進行中";
    startBtn.style.background = "#aaa";
    bBottomBtns.style.display = "none";
    scoreArea.innerHTML = "";

    // 計時器
    timeLeft = 5400;
    clearInterval(timerInt);
    timerInt = setInterval(updateTimer, 1000);
    updateTimer();

    // 顯示 A 部第一題
    renderA();
    updateCounts();
}

function updateTimer() {
    timeLeft--;
    var m = Math.floor(timeLeft / 60);
    var s = timeLeft % 60;
    timerDisplay.textContent = "⏱ " + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    if (timeLeft <= 0) {
        clearInterval(timerInt);
        alert("⏰ 時間到！考試自動提交。");
        submitExam();
    }
}

// ===================== A 部 =====================
function renderA() {
    if (aIndex >= 2) {
        aContent.innerHTML = '<div style="text-align:center;padding:20px;"><p style="color:#28a745;font-size:18px;font-weight:600;">✅ A 部已完成！</p><p style="margin-top:8px;color:#666;">請點擊上方「B部 — 選擇題」繼續。</p></div>';
        // 自動切到 B 部
        setTimeout(function() { tabB.click(); }, 1500);
        return;
    }
    var q = examA[aIndex];
    var html = "";
    html += '<div class="q-card">';
    html += '<div class="q-title">📝 A' + (aIndex + 1) + '（共2題）</div>';
    html += '<div class="q-body">' + q.scenario + '</div>';
    html += '<textarea id="aText" placeholder="在此輸入您的答案..."></textarea>';
    html += '<div class="btn-row">';
    html += '<button class="btn btn-primary" onclick="showARef(' + aIndex + ')">📖 顯示參考答案</button>';
    html += '<button class="btn btn-success" onclick="goNextA()">➡️ 下一題</button>';
    html += '</div>';
    html += '<div class="ref-answer" id="aRef"></div>';
    html += '</div>';
    aContent.innerHTML = html;
}

function showARef(idx) {
    var q = examA[idx];
    var ref = $("aRef");
    var html = "<h4>✅ 參考答案</h4><pre style=\"white-space:pre-wrap;font-family:inherit;\">" + q.ref + "</pre><p style=\"margin-top:6px;color:#155724;\"><strong>📋 評分要點：</strong></p><ul>";
    q.points.forEach(function(p) { html += "<li>" + p + "</li>"; });
    html += "</ul>";
    ref.innerHTML = html;
    ref.classList.add("show");
}

function goNextA() {
    aIndex++;
    renderA();
    updateCounts();
}

// ===================== B 部 =====================
function renderBList() {
    var html = '<div class="b-list">';
    for (var i = 0; i < examB.length; i++) {
        var q = examB[i];
        var answered = bAnswers[i] !== null;
        var isCorrect = answered && bAnswers[i] === q.ans;
        var bgColor = !answered ? "#f8f9fa" : (isCorrect ? "#d4edda" : "#f8d7da");
        var icon = !answered ? "⬜" : (isCorrect ? "✅" : "❌");
        html += '<div class="b-item' + (i === bIndex ? " active" : "") + '" style="background:' + bgColor + ';" onclick="goBDetail(' + i + ')">';
        html += '<span class="num">B' + (i + 1) + '.</span> ' + q.q.substring(0, 48) + (q.q.length > 48 ? "..." : "");
        html += '<span class="status">' + icon + '</span>';
        html += '</div>';
    }
    html += '</div>';
    html += '<div style="text-align:center;margin-top:12px;color:#666;font-size:13px;">⬜ 未作答 | ✅ 正確 | ❌ 錯誤</div>';
    bContent.innerHTML = html;
}

function goBDetail(idx) {
    bIndex = idx;
    var q = examB[idx] || examB[idx % examB.length];
    var realIdx = idx;
    if (idx >= examB.length) realIdx = idx % examB.length;
    q = examB[realIdx];
    var letters = ["A", "B", "C", "D"];
    var answered = bAnswers[realIdx] !== null;

    var html = '<div class="b-detail">';
    html += '<div class="q-card">';
    html += '<div class="q-text"><strong>B' + (realIdx + 1) + '.</strong> ' + q.q + '</div>';

    for (var i = 0; i < q.options.length; i++) {
        var cls = "";
        var icon = "";
        if (answered) {
            if (i === q.ans) { cls = "correct"; icon = " ✅"; }
            else if (i === bAnswers[realIdx]) { cls = "wrong"; icon = " ❌"; }
        }
        html += '<button class="opt-btn ' + cls + '" onclick="selectB(' + realIdx + ',' + i + ')" ' + (answered ? "disabled" : "") + '>';
        html += letters[i] + '. ' + q.options[i] + icon;
        html += '</button>';
    }

    // 解析區
    var expCls = "";
    var expText = "";
    if (answered) {
        if (bAnswers[realIdx] === q.ans) {
            expCls = "correct";
            expText = "✅ 正確！ " + q.exp;
        } else {
            expCls = "wrong";
            expText = "❌ 錯誤。正確答案是 " + letters[q.ans] + ". " + q.options[q.ans] + "<br><span style=\"color:#155724;\">📖 " + q.exp + "</span>";
        }
    }
    html += '<div class="exp-box ' + expCls + (answered ? " show" : "") + '" id="bExp">' + expText + '</div>';

    // 導航按鈕
    html += '<div class="btn-row" style="margin-top:12px;">';
    if (realIdx > 0) {
        html += '<button class="btn btn-outline" onclick="goBDetail(' + (realIdx - 1) + ')">⬅️ 上一題</button>';
    }
    if (realIdx < examB.length - 1) {
        html += '<button class="btn btn-primary" onclick="goBDetail(' + (realIdx + 1) + ')">➡️ 下一題</button>';
    } else {
        html += '<button class="btn btn-warning" onclick="scrollToBottom()">📋 返回列表</button>';
    }
    html += '</div>';
    html += '</div>'; // q-card
    html += '</div>'; // b-detail

    bContent.innerHTML = html;
}

function selectB(idx, sel) {
    if (bAnswers[idx] !== null) return; // 已作答不可改
    bAnswers[idx] = sel;
    goBDetail(idx); // 重新渲染（會顯示正確/錯誤狀態）
    updateCounts();
}

function scrollToBottom() {
    renderBList();
    // 滾到列表底部（提交按鈕區）
    setTimeout(function() {
        var el = $("bBottomBtns");
        if (el) el.scrollIntoView({ behavior: "smooth" });
    }, 100);
}

// ===================== 提交與計分 =====================
function submitExam() {
    clearInterval(timerInt);
    examStarted = false;

    // 計算分數
    var bScore = 0;
    var detailRows = "";
    var letters = ["A", "B", "C", "D"];

    for (var i = 0; i < examB.length; i++) {
        var q = examB[i];
        var ans = bAnswers[i];
        var isCorrect = ans === q.ans;
        if (isCorrect) bScore += 2.5;
        var yourAns = ans === null ? "⬜ 未答" : letters[ans] + ". " + q.options[ans];
        var correctAns = letters[q.ans] + ". " + q.options[q.ans];
        var icon = ans === null ? "⬜" : (isCorrect ? "✅" : "❌");
        var rowCls = ans === null ? "" : (isCorrect ? "ok" : "no");
        detailRows += "<tr class=\"" + rowCls + "\">";
        detailRows += "<td>B" + (i + 1) + "</td>";
        detailRows += "<td>" + q.q.substring(0, 60) + "</td>";
        detailRows += "<td>" + yourAns + "</td>";
        detailRows += "<td>" + correctAns + "</td>";
        detailRows += "<td style=\"font-size:16px;\">" + icon + "</td>";
        detailRows += "</tr>";
    }

    var totalScore = bScore; // A部需人工評分，這裡只計B部
    var passed = totalScore >= 75;

    var html = "";
    html += '<div class="result-wrap">';
    html += '<div class="result-summary">';
    html += '<h2>🏆 考試結果</h2>';
    html += '<div class="big-score">' + totalScore.toFixed(1) + ' / 100</div>';
    html += '<div class="verdict" style="color:' + (passed ? "#28a745" : "#dc3545") + ';">';
    html += passed ? "🎉 及格！恭喜你！" : "😢 不及格，再接再厲！";
    html += '</div>';
    html += '<p style="margin-top:8px;color:#666;font-size:13px;">📌 以上為 B 部自動評分（滿分100）。A 部請對照參考答案自行評分。</p>';
    html += '</div>';

    // 答案總表
    html += '<h3 style="margin:16px 0 8px;color:#003366;">📋 B 部答案總表</h3>';
    html += '<div style="overflow-x:auto;">';
    html += '<table class="result-table">';
    html += '<tr><th>題號</th><th>題目</th><th>你的答案</th><th>正確答案</th><th>結果</th></tr>';
    html += detailRows;
    html += '</table>';
    html += '</div>';

    html += '<div style="text-align:center;margin-top:20px;">';
    html += '<button class="btn btn-primary" onclick="resetAll()" style="padding:12px 36px;font-size:16px;">🔄 重新開始</button>';
    html += '</div>';
    html += '</div>';

    scoreArea.innerHTML = html;

    // 滾動到結果區
    setTimeout(function() {
        scoreArea.scrollIntoView({ behavior: "smooth" });
    }, 100);
}

function resetAll() {
    clearInterval(timerInt);
    examStarted = false;
    aIndex = 0;
    bIndex = 0;
    bAnswers = [];
    examA = [];
    examB = [];
    scoreArea.innerHTML = "";
    bBottomBtns.style.display = "none";
    startBtn.disabled = false;
    startBtn.textContent = "🚀 開始考試";
    startBtn.style.background = "";
    timerDisplay.textContent = "⏱ 90:00";
    aContent.innerHTML = '<p style="text-align:center;color:#888;margin:40px 0;">🚀 請點擊下方「開始考試」按鈕載入題目</p>';
    bContent.innerHTML = '<p style="text-align:center;color:#888;margin:40px 0;">📝 請先完成 A 部或點擊「開始考試」</p>';
    updateCounts();
    // 切回 A 部
    tabA.click();
}

// ===================== 更新計數 =====================
function updateCounts() {
    var aDone = Math.min(aIndex, 2);
    aCount.textContent = aDone + "/2";
    var bDone = bAnswers.filter(function(a) { return a !== null; }).length;
    bCount.textContent = bDone + "/40";
    // 當 B 部有題目且考試進行中，顯示底部按鈕
    if (examB.length > 0 && examStarted) {
        bBottomBtns.style.display = "block";
    }
}

// ===================== Tab 切換 =====================
tabA.addEventListener("click", function() {
    tabA.classList.add("active");
    tabB.classList.remove("active");
    panelA.classList.add("active");
    panelB.classList.remove("active");
});

tabB.addEventListener("click", function() {
    tabB.classList.add("active");
    tabA.classList.remove("active");
    panelB.classList.add("active");
    panelA.classList.remove("active");
    if (examStarted && examB.length > 0) {
        renderBList();
        bBottomBtns.style.display = "block";
    }
});

// ===================== 按鈕綁定 =====================
startBtn.addEventListener("click", startExam);
submitBtn.addEventListener("click", submitExam);
resetBtn.addEventListener("click", resetAll);

// 初始狀態
updateCounts();
console.log("✅ VHF 模擬考試系統已載入");
</script>
</body>
</html>
